<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | 練習抽選システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }
  .mobile-container {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: white;
  }
</style>
</head>
<body>
  <div class="mobile-container flex flex-col justify-center px-6 py-12">

    <!-- ロゴ・タイトル -->
    <div class="text-center mb-8">
      <div class="mb-4 flex justify-center text-purple-600"><svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 7.1a16.55 16.55 0 0 1 10.9 4"/><path d="M12 12a12.6 12.6 0 0 1-8.7 5"/><path d="M16.8 13.6a16.55 16.55 0 0 1-9 7.5"/><path d="M20.7 17a12.8 12.8 0 0 0-8.7-5 13.3 13.3 0 0 1 0-10"/><path d="M6.3 3.8a16.55 16.55 0 0 0 1.9 11.5"/><circle cx="12" cy="12" r="10"/></svg></div>
      <h1 class="text-2xl font-bold text-gray-900">練習抽選システム</h1>
      <p class="text-sm text-gray-500 mt-2">サークル練習参加抽選システム</p>
    </div>

    <!-- ログインカード -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6">
      <form>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
          <input type="email" id="email" placeholder="taro.yamada@example.com"
                 class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
        </div>
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
          <input type="password" id="password" placeholder="••••••••"
                 class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
        </div>
        <button type="button"
                class="w-full h-12 bg-purple-600 text-white font-bold rounded-lg hover:bg-purple-700 active:bg-purple-800 transition-colors">
          ログイン
        </button>
      </form>
    </div>

    <!-- リンク -->
    <div class="mt-6 text-center space-y-3">
      <p>
        <a href="#" class="text-sm font-medium text-purple-600 hover:underline">新規登録はこちら</a>
      </p>
      <p>
        <a href="#" class="text-sm text-purple-600 hover:underline">パスワードを忘れた方</a>
      </p>
    </div>

  </div>
</body>
</html>
