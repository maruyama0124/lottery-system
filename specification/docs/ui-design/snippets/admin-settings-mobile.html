<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設定 | 代表用管理画面</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    margin: 0;
  }
  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: white;
  }
</style>

<div class="app-shell relative pb-20">
  <!-- Sticky header -->
  <header class="sticky top-0 z-20 bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-2">
    <h1 class="text-lg font-bold text-gray-900">設定</h1>
    <span class="bg-purple-600 text-white text-xs font-semibold px-2 py-0.5 rounded-full">管理</span>
    <span class="text-sm text-gray-500">男子</span>
  </header>

  <main class="px-4 py-4 space-y-4">
    <!-- Section 1: 抽選設定 -->
    <section class="border border-gray-200 rounded-xl p-4 shadow-sm">
      <h2 class="font-bold text-gray-900 mb-3">抽選設定</h2>
      <label class="block text-sm font-medium text-gray-700 mb-1">落選救済係数 α</label>
      <input type="number" value="0.2" step="0.1" min="0"
        class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-purple-600">
      <p class="text-xs text-gray-500 mt-2">前月に落選した回数 × α だけ当選確率が上がります</p>
      <button class="w-full mt-4 bg-purple-600 text-white font-semibold text-sm py-2.5 rounded-lg">保存する</button>
    </section>

    <!-- Section 2: 代表権限の引き継ぎ -->
    <section class="border border-gray-200 rounded-xl p-4 shadow-sm">
      <h2 class="font-bold text-gray-900 mb-3">代表権限の引き継ぎ</h2>
      <label class="block text-sm font-medium text-gray-700 mb-1">引き継ぎ先メンバー</label>
      <select class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-purple-600">
        <option selected>田中 翔（2年）</option>
        <option>山田 健太（3年）</option>
        <option>伊藤 湊（1年）</option>
        <option>鈴木 大輝（2年）</option>
      </select>
      <button class="w-full mt-4 border border-purple-600 text-purple-600 font-semibold text-sm py-2.5 rounded-lg">代表権限を付与</button>
      <p class="text-xs text-gray-500 mt-2">付与すると相手も代表として全機能を使えます</p>
    </section>

    <!-- Section 3: メンバーの無効化 -->
    <section class="border border-red-200 bg-red-50 rounded-xl p-4 shadow-sm">
      <h2 class="font-bold text-red-700 mb-2">メンバーの無効化</h2>
      <p class="text-sm text-red-600 mb-4">卒業・退会したメンバーを抽選対象から外します</p>
      <button class="w-full border border-red-500 text-red-600 bg-white font-semibold text-sm py-2.5 rounded-lg">無効化するメンバーを選ぶ</button>
    </section>

    <p class="text-center text-xs text-gray-400 pt-4">練習抽選システム v1.0</p>
  </main>

  <!-- Bottom tab bar -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-gray-200 flex z-20">
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="text-[10px] mt-0.5">ホーム</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg><span class="text-[10px] mt-0.5">日程</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg><span class="text-[10px] mt-0.5">抽選</span>

      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg><span class="text-[10px] mt-0.5">結果</span>
    </a>

      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="text-[10px] mt-0.5">名簿</span>
    </a>
  </nav>
</div>
