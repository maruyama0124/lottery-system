<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名簿 | 代表用管理画面</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    margin: 0;
  }
  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: white;
  }
</style>

<div class="app-shell relative pb-20">
  <!-- Sticky header -->
  <header class="sticky top-0 z-20 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <h1 class="text-lg font-bold text-gray-900">名簿</h1>
      <span class="bg-purple-600 text-white text-xs font-semibold px-2 py-0.5 rounded-full">管理</span>
      <span class="text-sm text-gray-500">男子</span>
    </div>
    <button class="border border-purple-600 text-purple-600 text-sm font-semibold px-3 py-1.5 rounded-lg inline-flex items-center gap-1">CSV<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></button>
  </header>

  <main class="px-4 py-4 space-y-4">
    <!-- Search bar -->
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input type="text" placeholder="名前・学籍番号で検索"
        class="w-full bg-gray-100 rounded-xl pl-10 pr-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-600">
    </div>

    <!-- Filter chips -->
    <div class="flex gap-2 overflow-x-auto pb-1 -mx-4 px-4" style="scrollbar-width:none;">
      <button class="shrink-0 bg-purple-600 text-white text-sm font-semibold px-3.5 py-1.5 rounded-full">全員(152)</button>
      <button class="shrink-0 bg-gray-100 text-gray-600 text-sm px-3.5 py-1.5 rounded-full">男子(72)</button>
      <button class="shrink-0 bg-gray-100 text-gray-600 text-sm px-3.5 py-1.5 rounded-full">女子(80)</button>
      <button class="shrink-0 bg-gray-100 text-gray-600 text-sm px-3.5 py-1.5 rounded-full">1年</button>
      <button class="shrink-0 bg-gray-100 text-gray-600 text-sm px-3.5 py-1.5 rounded-full">2年</button>
      <button class="shrink-0 bg-gray-100 text-gray-600 text-sm px-3.5 py-1.5 rounded-full">3年</button>
      <button class="shrink-0 bg-gray-100 text-gray-600 text-sm px-3.5 py-1.5 rounded-full">マネ</button>
    </div>

    <!-- Member cards -->
    <div class="space-y-3">
      <!-- Expanded card -->
      <div class="border border-purple-200 rounded-xl shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3 bg-purple-50">
          <div class="flex items-center gap-2">
            <span class="font-bold text-gray-900">佐藤 花子</span>
            <span class="bg-pink-100 text-pink-700 text-xs font-semibold px-2 py-0.5 rounded-full">女子</span>
            <span class="bg-gray-200 text-gray-700 text-xs font-semibold px-2 py-0.5 rounded-full">2年</span>
          </div>
          <span class="text-gray-400 text-sm"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></span>
        </div>
        <dl class="px-4 py-3 text-sm divide-y divide-gray-100">
          <div class="flex py-2">
            <dt class="w-24 shrink-0 text-gray-500">メール</dt>
            <dd class="text-gray-900 break-all">hanako.sato@example.com</dd>
          </div>
          <div class="flex py-2">
            <dt class="w-24 shrink-0 text-gray-500">電話</dt>
            <dd class="text-gray-900">090-1234-5678</dd>
          </div>
          <div class="flex py-2">
            <dt class="w-24 shrink-0 text-gray-500">住所</dt>
            <dd class="text-gray-900">東京都八王子市〇〇 1-2-3</dd>
          </div>
          <div class="flex py-2">
            <dt class="w-24 shrink-0 text-gray-500">学部学科</dt>
            <dd class="text-gray-900">経済学部経済学科</dd>
          </div>
          <div class="flex py-2">
            <dt class="w-24 shrink-0 text-gray-500">学籍番号</dt>
            <dd class="text-gray-900">26E1234</dd>
          </div>
          <div class="flex py-2">
            <dt class="w-24 shrink-0 text-gray-500">区分</dt>
            <dd class="text-gray-900">プレイヤー</dd>
          </div>
        </dl>
      </div>

      <!-- Collapsed cards -->
      <div class="border border-gray-200 rounded-xl px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="font-semibold text-gray-900">山田 健太</span>
          <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded-full">男子</span>
          <span class="bg-gray-200 text-gray-700 text-xs font-semibold px-2 py-0.5 rounded-full">3年</span>
        </div>
        <span class="text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </div>

      <div class="border border-gray-200 rounded-xl px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-semibold text-gray-900">伊藤 湊</span>
          <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded-full">男子</span>
          <span class="bg-gray-200 text-gray-700 text-xs font-semibold px-2 py-0.5 rounded-full">1年</span>
          <span class="bg-amber-100 text-amber-700 text-xs font-semibold px-2 py-0.5 rounded-full">マネ</span>
        </div>
        <span class="text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </div>

      <div class="border border-gray-200 rounded-xl px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="font-semibold text-gray-900">高橋 美咲</span>
          <span class="bg-pink-100 text-pink-700 text-xs font-semibold px-2 py-0.5 rounded-full">女子</span>
          <span class="bg-gray-200 text-gray-700 text-xs font-semibold px-2 py-0.5 rounded-full">1年</span>
        </div>
        <span class="text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 pt-2">152名中 4名を表示</p>
  </main>

  <!-- Bottom tab bar -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-gray-200 flex z-20">
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="text-[10px] mt-0.5">ホーム</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg><span class="text-[10px] mt-0.5">日程</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg><span class="text-[10px] mt-0.5">抽選</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg><span class="text-[10px] mt-0.5">結果</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-purple-600 font-semibold">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="text-[10px] mt-0.5">名簿</span>
    </a>
  </nav>
</div>
