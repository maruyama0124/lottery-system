<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8月の投票 - 練習抽選システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }
</style>
</head>
<body>
<div class="relative mx-auto bg-white" style="max-width: 480px; margin: 0 auto; min-height: 100vh; background: white;">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-20 bg-white border-b border-gray-200 px-4 py-3">
    <h1 class="text-lg font-bold text-gray-900">8月の投票</h1>
  </header>

  <!-- Deadline Banner -->
  <div class="bg-yellow-50 border-b border-yellow-200 px-4 py-2.5 flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-700 shrink-0"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <p class="text-sm font-semibold text-yellow-800">投票締切: 8/20(木) 23:59</p>
  </div>

  <!-- Main -->
  <main class="px-4 pt-4 pb-40 space-y-3">

    <p class="text-sm text-gray-600">参加したい練習日を選んでください（複数選択可）</p>

    <!-- 8/3 selected -->
    <label class="block rounded-xl border-2 border-purple-600 bg-purple-50 p-4 cursor-pointer">
      <div class="flex items-center gap-3">
        <input type="checkbox" checked class="h-5 w-5 rounded border-gray-300 text-purple-600 accent-purple-600 shrink-0">
        <div class="flex-1">
          <p class="text-base font-bold text-gray-900">8/3(月) 18:00-21:00</p>
          <p class="text-sm text-gray-600 mt-0.5">第一体育館 ・ 定員30名</p>
        </div>
      </div>
    </label>

    <!-- 8/10 unselected -->
    <label class="block rounded-xl border-2 border-gray-200 bg-white p-4 cursor-pointer">
      <div class="flex items-center gap-3">
        <input type="checkbox" class="h-5 w-5 rounded border-gray-300 text-purple-600 accent-purple-600 shrink-0">
        <div class="flex-1">
          <p class="text-base font-bold text-gray-900">8/10(月) 18:00-21:00</p>
          <p class="text-sm text-gray-600 mt-0.5">市民体育館 ・ 定員30名</p>
        </div>
      </div>
    </label>

    <!-- 8/17 unselected -->
    <label class="block rounded-xl border-2 border-gray-200 bg-white p-4 cursor-pointer">
      <div class="flex items-center gap-3">
        <input type="checkbox" class="h-5 w-5 rounded border-gray-300 text-purple-600 accent-purple-600 shrink-0">
        <div class="flex-1">
          <p class="text-base font-bold text-gray-900">8/17(月) 18:00-21:00</p>
          <p class="text-sm text-gray-600 mt-0.5">第一体育館 ・ 定員30名</p>
        </div>
      </div>
    </label>

    <!-- 8/24 selected -->
    <label class="block rounded-xl border-2 border-purple-600 bg-purple-50 p-4 cursor-pointer">
      <div class="flex items-center gap-3">
        <input type="checkbox" checked class="h-5 w-5 rounded border-gray-300 text-purple-600 accent-purple-600 shrink-0">
        <div class="flex-1">
          <p class="text-base font-bold text-gray-900">8/24(月) 18:00-21:00</p>
          <p class="text-sm text-gray-600 mt-0.5">第一体育館 ・ 定員30名</p>
        </div>
      </div>
    </label>

    <!-- 8/31 selected -->
    <label class="block rounded-xl border-2 border-purple-600 bg-purple-50 p-4 cursor-pointer">
      <div class="flex items-center gap-3">
        <input type="checkbox" checked class="h-5 w-5 rounded border-gray-300 text-purple-600 accent-purple-600 shrink-0">
        <div class="flex-1">
          <p class="text-base font-bold text-gray-900">8/31(月) 18:00-21:00</p>
          <p class="text-sm text-gray-600 mt-0.5">市民体育館 ・ 定員30名</p>
        </div>
      </div>
    </label>

  </main>

  <!-- Fixed Submit Button (above tab bar) -->
  <div class="fixed left-1/2 -translate-x-1/2 w-full z-30 bg-white border-t border-gray-200 px-4 py-3" style="max-width: 480px; bottom: 57px;">
    <button class="w-full rounded-lg bg-purple-600 text-white text-sm font-semibold py-3.5 hover:bg-purple-700 active:bg-purple-800">
      この内容で投票する（3日選択中）
    </button>
  </div>

  <!-- Fixed Tab Bar -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full z-30 bg-white border-t border-gray-200" style="max-width: 480px;">
    <div class="grid grid-cols-4">
      <a href="#" class="flex flex-col items-center py-2 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="text-[10px] font-medium mt-1">ホーム</span>
      </a>
      <a href="#" class="flex flex-col items-center py-2 text-purple-600">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><path d="M5 7c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v12H5V7Z"/><path d="M22 19H2"/></svg>
        <span class="text-[10px] font-semibold mt-1">投票</span>
      </a>
      <a href="#" class="flex flex-col items-center py-2 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
        <span class="text-[10px] font-medium mt-1">結果</span>
      </a>
      <a href="#" class="flex flex-col items-center py-2 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-[10px] font-medium mt-1">プロフィール</span>
      </a>
    </div>
  </nav>

</div>
</body>
</html>
