<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>練習日程管理 | サークル練習抽選システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #f3f4f6;
  }
  .app-container {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: white;
  }
</style>
</head>
<body>
<div class="app-container relative pb-36">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-20 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <h1 class="text-lg font-bold text-gray-900">練習日程管理</h1>
      <span class="bg-purple-600 text-white text-xs font-semibold px-2 py-0.5 rounded-full">管理</span>
    </div>
    <span class="text-sm font-medium text-gray-600">男子</span>
  </header>

  <main class="px-4 py-4 space-y-6">

    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold text-gray-900">2026年8月</h2>
      <span class="text-xs text-gray-500">代表: 山田 太郎</span>
    </div>

    <!-- セクション1: 投票受付期間 -->
    <section>
      <h3 class="text-sm font-bold text-gray-900 mb-2">投票受付期間</h3>
      <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-4">
        <!-- 時刻は入力させない。開始日 0:00 〜 締切日 23:59 に固定 (D-014) -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="vote-start" class="block text-xs font-semibold text-gray-500 mb-1.5">開始日</label>
            <input id="vote-start" type="date" value="2026-08-01"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
          </div>
          <div>
            <label for="vote-end" class="block text-xs font-semibold text-gray-500 mb-1.5">締切日</label>
            <input id="vote-end" type="date" value="2026-08-20"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
          </div>
        </div>
        <p class="-mt-2 text-xs text-gray-500">開始日の0:00から締切日の23:59まで投票できます</p>
      </div>
    </section>

    <!-- セクション1.5: 練習日の追加フォーム（履歴から入力・30分刻み: D-014） -->
    <section>
      <h3 class="text-sm font-bold text-gray-900 mb-2">練習日を追加</h3>
      <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-3">
        <div>
          <label for="suggestion" class="block text-xs font-semibold text-gray-500 mb-1.5">よく使う練習から入力</label>
          <select id="suggestion" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
            <option>選択してください</option>
            <option>目白小 18:00〜21:30（定員30・4回）</option>
            <option>文京区 18:30〜21:30（定員24・3回）</option>
            <option>雑司ヶ谷 18:00〜21:30（定員13・1回）</option>
          </select>
        </div>
        <div>
          <label for="practice-date" class="block text-xs font-semibold text-gray-500 mb-1.5">日付</label>
          <input id="practice-date" type="date" value="2026-08-26"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="starts-at" class="block text-xs font-semibold text-gray-500 mb-1.5">開始時刻</label>
            <select id="starts-at" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
              <option>17:30</option><option selected>18:00</option><option>18:30</option><option>19:00</option>
            </select>
          </div>
          <div>
            <label for="ends-at" class="block text-xs font-semibold text-gray-500 mb-1.5">終了時刻</label>
            <select id="ends-at" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
              <option>21:00</option><option selected>21:30</option><option>22:00</option>
            </select>
          </div>
        </div>
        <p class="text-xs text-gray-500">時刻は30分単位で指定します</p>
        <!-- 同じ月内で同じ体育館・時間帯の練習が複数回あるため (REQ-003.7 / D-014) -->
        <div class="flex gap-2 pt-1">
          <button class="flex-1 rounded-lg border border-purple-300 py-2 text-xs font-semibold text-purple-600 hover:bg-purple-50">
            同じ内容で別日を追加
          </button>
          <button class="flex-1 rounded-lg border border-gray-300 py-2 text-xs font-semibold text-gray-500 hover:bg-gray-50">
            この練習日を削除
          </button>
        </div>
      </div>
    </section>

    <!-- セクション2: 練習日一覧 -->
    <section>
      <h3 class="text-sm font-bold text-gray-900 mb-2">練習日一覧（5件）</h3>
      <div class="space-y-3">

        <!-- 練習日カード 1 -->
        <div class="bg-white border border-gray-200 rounded-xl p-4">
          <div class="flex items-start justify-between">
            <p class="text-base font-bold text-gray-900">8/3(月)</p>
            <div class="flex gap-2">
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 text-sm" aria-label="編集"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg></button>
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-red-100 text-sm" aria-label="削除"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button>
            </div>
          </div>
          <div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-600">
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 18:00〜21:00</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg> 第一体育館</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 定員 30名</span>
          </div>
        </div>

        <!-- 練習日カード 2 -->
        <div class="bg-white border border-gray-200 rounded-xl p-4">
          <div class="flex items-start justify-between">
            <p class="text-base font-bold text-gray-900">8/8(土)</p>
            <div class="flex gap-2">
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 text-sm" aria-label="編集"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg></button>
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-red-100 text-sm" aria-label="削除"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button>
            </div>
          </div>
          <div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-600">
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 13:00〜17:00</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg> 第二体育館</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 定員 24名</span>
          </div>
        </div>

        <!-- 練習日カード 3 -->
        <div class="bg-white border border-gray-200 rounded-xl p-4">
          <div class="flex items-start justify-between">
            <p class="text-base font-bold text-gray-900">8/12(水)</p>
            <div class="flex gap-2">
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 text-sm" aria-label="編集"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg></button>
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-red-100 text-sm" aria-label="削除"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button>
            </div>
          </div>
          <div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-600">
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 18:00〜21:00</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg> 第一体育館</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 定員 30名</span>
          </div>
        </div>

        <!-- 練習日カード 4 -->
        <div class="bg-white border border-gray-200 rounded-xl p-4">
          <div class="flex items-start justify-between">
            <p class="text-base font-bold text-gray-900">8/22(土)</p>
            <div class="flex gap-2">
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 text-sm" aria-label="編集"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg></button>
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-red-100 text-sm" aria-label="削除"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button>
            </div>
          </div>
          <div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-600">
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 9:00〜12:00</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg> 市民スポーツセンター</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 定員 20名</span>
          </div>
        </div>

        <!-- 練習日カード 5 -->
        <div class="bg-white border border-gray-200 rounded-xl p-4">
          <div class="flex items-start justify-between">
            <p class="text-base font-bold text-gray-900">8/26(水)</p>
            <div class="flex gap-2">
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 text-sm" aria-label="編集"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg></button>
              <button class="w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-red-100 text-sm" aria-label="削除"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button>
            </div>
          </div>
          <div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-600">
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 18:00〜21:00</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg> 第一体育館</span>
            <span class="inline-flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 定員 30名</span>
          </div>
        </div>

        <!-- 追加ボタン -->
        <button class="w-full border-2 border-dashed border-gray-300 hover:border-purple-400 hover:text-purple-600 text-gray-500 rounded-xl py-3.5 text-sm font-semibold">
          ＋ 練習日を追加
        </button>

      </div>
    </section>

  </main>

  <!-- 下部固定: 保存ボタン + タブバー -->
  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-20">
    <div class="bg-white/95 backdrop-blur border-t border-gray-200 px-4 py-3">
      <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-sm py-3.5 rounded-lg shadow-sm">
        保存する
      </button>
    </div>
    <nav class="bg-white border-t border-gray-200 flex">

        <span class="text-[10px] mt-0.5">ホーム</span>
