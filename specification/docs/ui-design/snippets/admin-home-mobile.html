<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理ホーム | サークル練習抽選システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #f3f4f6;
  }
  .app-container {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: white;
  }
</style>
</head>
<body>
<div class="app-container relative pb-20">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-20 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <h1 class="text-lg font-bold text-gray-900">管理ホーム</h1>
      <span class="bg-purple-600 text-white text-xs font-semibold px-2 py-0.5 rounded-full">管理</span>
    </div>
    <span class="text-sm font-medium text-gray-600">男子</span>
  </header>

  <main class="px-4 py-4 space-y-4">

    <!-- 月表示 -->
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold text-gray-900">2026年8月</h2>
      <span class="text-xs text-gray-500">代表: 山田 太郎</span>
    </div>

    <!-- ステップ表示 -->
    <div class="bg-white border border-gray-200 rounded-xl p-4">
      <p class="text-xs font-semibold text-gray-500 mb-3">今月の進行状況</p>
      <div class="flex items-start">
        <!-- Step 1: 完了 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center text-sm font-bold"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <span class="mt-1.5 text-[10px] text-purple-600 font-semibold text-center leading-tight">日程登録</span>
        </div>
        <div class="flex-none w-4 h-0.5 bg-purple-600 mt-4"></div>
        <!-- Step 2: 完了 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center text-sm font-bold"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <span class="mt-1.5 text-[10px] text-purple-600 font-semibold text-center leading-tight">投票受付</span>
        </div>
        <div class="flex-none w-4 h-0.5 bg-purple-600 mt-4"></div>
        <!-- Step 3: アクティブ -->
        <div class="flex-1 flex flex-col items-center">
          <div class="w-8 h-8 rounded-full bg-white border-2 border-purple-600 text-purple-600 flex items-center justify-center text-sm font-bold ring-4 ring-purple-100">3</div>
          <span class="mt-1.5 text-[10px] text-purple-600 font-bold text-center leading-tight">抽選</span>
        </div>
        <div class="flex-none w-4 h-0.5 bg-gray-300 mt-4"></div>
        <!-- Step 4: 未着手 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center text-sm font-bold">4</div>
          <span class="mt-1.5 text-[10px] text-gray-400 text-center leading-tight">微調整</span>
        </div>
        <div class="flex-none w-4 h-0.5 bg-gray-300 mt-4"></div>
        <!-- Step 5: 未着手 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center text-sm font-bold">5</div>
          <span class="mt-1.5 text-[10px] text-gray-400 text-center leading-tight">公開</span>
        </div>
      </div>
    </div>

    <!-- 投票状況カード -->
    <div class="bg-white border border-gray-200 rounded-xl p-4">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-sm font-bold text-gray-900">投票状況</h3>
        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium">締切済み</span>
      </div>
      <p class="text-gray-900 mb-2">
        <span class="text-2xl font-bold text-purple-600">58</span>
        <span class="text-lg font-semibold text-gray-500"> / 72 名</span>
        <span class="text-sm text-gray-600">が投票済み</span>
      </p>
      <div class="w-full h-2.5 bg-gray-200 rounded-full overflow-hidden mb-2">
        <div class="h-full bg-purple-600 rounded-full" style="width: 80.5%;"></div>
      </div>
      <p class="text-xs text-gray-500">締切: 8/20(木) 23:59（締切済み）</p>
    </div>

    <!-- 次のアクション促しカード -->
    <div class="bg-purple-50 border border-purple-200 rounded-xl p-4">
      <div class="flex items-start gap-3">
        <span class="text-purple-600"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg></span>
        <div class="flex-1">
          <p class="text-sm font-semibold text-gray-900 leading-relaxed">投票が締め切られました。<br>抽選を実行しましょう</p>
          <button class="mt-3 w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-sm py-3 rounded-lg shadow-sm">
            抽選へ進む
          </button>
        </div>
      </div>
    </div>

    <!-- メニューリスト -->
    <div class="bg-white border border-gray-200 rounded-xl divide-y divide-gray-100 overflow-hidden">
      <a href="#" class="flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50">
        <span class="w-7 flex justify-center text-gray-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg></span>
        <span class="flex-1 text-sm font-medium text-gray-900">練習日程の管理</span>
        <span class="text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50">
        <span class="w-7 flex justify-center text-gray-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg></span>
        <span class="flex-1 text-sm font-medium text-gray-900">抽選の実行</span>
        <span class="text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50">
        <span class="w-7 flex justify-center text-gray-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg></span>
        <span class="flex-1 text-sm font-medium text-gray-900">結果の確認・微調整</span>
        <span class="text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50">
        <span class="w-7 flex justify-center text-gray-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <span class="flex-1 text-sm font-medium text-gray-900">名簿</span>
        <span class="text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50">
        <span class="w-7 flex justify-center text-gray-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <span class="flex-1 text-sm font-medium text-gray-900">設定</span>
        <span class="text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </a>
    </div>

  </main>

  <!-- 下部固定タブバー -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-gray-200 flex z-20">
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-purple-600">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="text-[10px] font-bold mt-0.5">ホーム</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
      <span class="text-[10px] mt-0.5">日程</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="12" height="12" x="2" y="10" rx="2" ry="2"/><path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6"/><path d="M6 18h.01"/><path d="M10 14h.01"/><path d="M15 6h.01"/><path d="M18 9h.01"/></svg>
      <span class="text-[10px] mt-0.5">抽選</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
      <span class="text-[10px] mt-0.5">結果</span>
    </a>
    <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="text-[10px] mt-0.5">名簿</span>
    </a>
  </nav>

</div>
</body>
</html>
