<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール - サークル練習参加抽選システム</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #f3f4f6;
  }
</style>
</head>
<body>
  <div style="max-width: 480px; margin: 0 auto; min-height: 100vh; background: white;" class="relative pb-20">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-10 bg-white border-b border-gray-200 px-4 py-3">
      <h1 class="text-lg font-bold text-gray-900">プロフィール</h1>
    </header>

    <main class="px-4 py-5">

      <form class="space-y-5">

        <!-- メールアドレス（編集不可） -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
          <div class="w-full bg-gray-100 text-gray-500 border border-gray-200 rounded-lg px-3 py-2.5 text-sm">
            hanako.sato@example.com
          </div>
          <p class="text-xs text-gray-400 mt-1">メールアドレスは変更できません</p>
        </div>

        <!-- 名前 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">名前</label>
          <input type="text" value="佐藤 花子"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
        </div>

        <!-- 住所 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">住所</label>
          <input type="text" value="東京都八王子市〇〇 1-2-3"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
        </div>

        <!-- 電話番号 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">電話番号</label>
          <input type="tel" value="090-1234-5678"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
        </div>

        <!-- 学年 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">学年</label>
          <select class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
            <option>1年</option>
            <option selected>2年</option>
            <option>3年</option>
            <option>4年</option>
          </select>
        </div>

        <!-- 学部学科 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">学部学科</label>
          <input type="text" value="経済学部経済学科"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
        </div>

        <!-- 学籍番号 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">学籍番号</label>
          <input type="text" value="26E1234"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600">
        </div>

        <!-- マネージャー区分（表示のみ） -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">マネージャー区分</label>
          <div class="w-full bg-gray-100 text-gray-500 border border-gray-200 rounded-lg px-3 py-2.5 text-sm">
            プレイヤー
          </div>
        </div>

        <!-- 保存ボタン -->
        <button type="button"
          class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg py-3 text-sm">
          保存する
        </button>

      </form>

      <!-- ログアウト -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <button type="button"
          class="w-full border border-red-500 text-red-600 hover:bg-red-50 font-semibold rounded-lg py-3 text-sm bg-white">
          ログアウト
        </button>
      </div>

    </main>

    <!-- タブバー -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-gray-200 flex z-10">
      <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="text-[10px] mt-0.5">ホーム</span>
      </a>
      <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><path d="M5 7c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v12H5V7Z"/><path d="M22 19H2"/></svg>
        <span class="text-[10px] mt-0.5">投票</span>
      </a>
      <a href="#" class="flex-1 flex flex-col items-center py-2 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
        <span class="text-[10px] mt-0.5">結果</span>
      </a>
      <a href="#" class="flex-1 flex flex-col items-center py-2 text-purple-600 font-semibold">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-[10px] mt-0.5">プロフィール</span>
      </a>
    </nav>

  </div>
</body>
</html>
